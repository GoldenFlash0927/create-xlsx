name: build-win-exe
on:
  workflow_dispatch: {}   # 手动触发
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r create-xlsx/requirements.txt pyinstaller

      - name: Build exe
        run: |
          cd create-xlsx
          pyinstaller --onefile --name update_excel ^
            --add-data "模版.xlsx;." ^
            update_excel.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: update_excel_win
          path: create-xlsx/dist/update_excel.exe